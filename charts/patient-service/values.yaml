# ==========================================================
# Configuration pour PATIENT-SERVICE
# ==========================================================

replicaCount: 1

image:
  repository: bechir19/patient-service
  pullPolicy: Never
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Annotations pour les PODS (Très important pour Prometheus)
podAnnotations: 
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "8080"

podLabels: {}

podSecurityContext: {}
securityContext: {}

# Configuration du SERVICE (Réseau interne)
service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8080"

# Ressources (Limites pour protéger la RAM de la VM)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# CONFIGURATION DES PROBES (Vérification de santé)
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 100 # Laisse le temps au service de démarrer
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 80
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

# Section INGRESS (Obligatoire pour éviter les erreurs de template)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: patient-service.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Section AUTOSCALING (Obligatoire pour éviter les erreurs de template)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# CORRECTION DE L'ERREUR "nil pointer" : Ajout de la section httpRoute
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - patient-service.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/patient

# Sections additionnelles (vides par défaut)
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
