spring.application.name=order-service
server.port=8081

# Connexion Base de données (MySQL)
spring.datasource.url=jdbc:mysql://mysql:3306/order_service
spring.datasource.username=order_user
spring.datasource.password=order_pass
spring.jpa.hibernate.ddl-auto=none

# CORRECTION : Ne pas utiliser localhost pour l'inventory
inventory.service.url=http://inventory-service:8082

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.metrics.export.prometheus.enabled=true

# Resilience4j Properties
resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=5s

# Kafka Properties - CORRECTION : Utiliser le nom du service 'broker' et 'schema-registry'
spring.kafka.bootstrap-servers=broker:9092
spring.kafka.template.default-topic=order-placed
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
# Le port du schema-registry est 8081 d'après votre 'kubectl get svc'
spring.kafka.producer.properties.schema.registry.url=http://schema-registry:8081

# Observabilité (Metrics & Tracing)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=order-service
management.tracing.sampling.probability=1.0

# Loki URL - Déjà correct
loki.url=http://loki:3100/loki/api/v1/push
