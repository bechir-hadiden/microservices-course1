spring.application.name=doctor-service
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/doctor_service
spring.datasource.username=doctor_user
spring.datasource.password=doctor_pass
spring.jpa.hibernate.ddl-auto=none
server.port=8082
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
management.endpoints.web.exposure.include=*
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=doctor-service
management.tracing.sampling.probability=1.0
# Loki URL
loki.url=http://loki:3100/loki/api/v1/push
