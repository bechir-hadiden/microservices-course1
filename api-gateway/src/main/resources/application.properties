spring.application.name=api-gateway
server.port=9000

# CORRECTION : Utiliser le nom du service Keycloak dans le cluster
# Au lieu de localhost:8181, on utilise le nom du service K8s (keycloak) et son port interne (8080)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/spring-microservices-security-realm

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Configuration Swagger Aggregator (Vérifiez bien les ports !)
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory-service/v3/api-docs

# Actuator & Prometheus
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=api-gateway

# Resilience4j (Déjà correct)
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s

# Observabilité
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=api-gateway
management.tracing.sampling.probability=1.0

# Loki URL
loki.url=http://loki:3100/loki/api/v1/push

# CORRECTION DES URLS DES SERVICES (Utiliser les ports réels)
product.service.url=http://product-service:8080
order.service.url=http://order-service:8081
inventory.service.url=http://inventory-service:8082

management.zipkin.tracing.endpoint=http://tempo:9411/api/v2/spans
