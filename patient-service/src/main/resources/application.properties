spring.application.name=patient-service
spring.data.mongodb.uri=mongodb://root:password@mongodb:27017/patient-service?authSource=admin&connectTimeoutMS=10000&serverSelectionTimeoutMS=10000
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=patient-service
management.tracing.sampling.probability=1.0
# Loki URL
loki.url=http://loki:3100/loki/api/v1/push
management.health.mongo.enabled=false
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

