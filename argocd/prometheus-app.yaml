apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-monitoring
  namespace: argocd
spec:
  project: default
  source:
    chart: prometheus
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 25.21.0 # Version stable du chart
    helm:
      values: |
        server:
          persistentVolume:
            size: 5Gi  # On limite la taille pour ne pas remplir votre disque
          service:
            type: ClusterIP
        alertmanager:
          enabled: false # On désactive pour économiser de la RAM
        pushgateway:
          enabled: false # On désactive pour économiser de la RAM
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
